name: ADEL Web — Smoke and build

on:
  push:
    branches: [audit/adel-web-003-ctas-demo]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: node --test tests/*.test.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
